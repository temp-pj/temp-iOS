opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping

disabled_rules:
  - trailing_whitespace
  - line_length
  - switch_case_alignment
  - trailing_newline
  - multiple_closures_with_trailing_closure
  - force_unwrapping
  - force_try
  - nesting

excluded:
  - Tuist
  - Derived
  - Project.swift
  - vendor
  - vendor/bundle
  - Pods
  - Carthage
  - .build
  - DerivedData

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 150
  error: 200
  excluded:
    - "**/Tests/**"
